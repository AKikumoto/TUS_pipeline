# POST-INSTALL STEPS REQUIRED (cannot be automated via YML):
#
# 1. pycork (pybind11 must be upgraded manually for Python 3.11; pycork's CMake finds GMP
#    only through GMP_INC and GMP_LIB):
#
#    cd ~
#    git clone https://github.com/drlukeparry/pycork.git
#    cd pycork
#    git checkout d9efcd1da212c685345f65503ba253373dcdece0
#    git submodule update --init --recursive
#    cd external/pybind11 && git fetch && git checkout v2.11.0 && cd ../..
#    GMP_INC="$CONDA_PREFIX/include" GMP_LIB="$CONDA_PREFIX/lib" pip install .
#
# 2. BabelBrain (no pyproject.toml; install via PYTHONPATH), at the Mac's commit:
#
#    cd ~
#    git clone https://github.com/ProteusMRIgHIFU/BabelBrain.git
#    cd BabelBrain && git checkout 5237cd236c12763049a53afe782a0cd19ab388f3 && cd ~
#    echo "export BABELBRAIN_DIR=~/BabelBrain" >> ~/.bashrc
#    echo "export PYTHONPATH=~/BabelBrain:\$PYTHONPATH" >> ~/.bashrc
#    source ~/.bashrc
#
# 3. CUDA module on Oscar (required every session):
#
#    module load cuda/12.9.0-cinr
#
# 4. NOT AVAILABLE on Linux (skip):
#    - metalcomputebabel  (macOS Metal only)
#    - pynput GUI mode    (use USE_PYNPUT=False on HPC)
