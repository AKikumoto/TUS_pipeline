# mri on Linux x86_64 (Oscar, BSWIFT II), every version pinned to the PI's Mac's mri
# (~/miniforge3/envs/mri, its conda list of 2026-11-24; PI, 2026-11-24). Left out: the
# Mac-only packages (mlx, metalcomputebabel, pyobjc, appnope) and itables, which the Mac's
# lacks and nothing imports. Added: cupy-cuda12x, at BSWIFT II's build of 2026-11-24; the
# Mac's BLAS (OpenBLAS 0.3.30); and the Intel libraries SimNIBS asks for on Linux, at the
# versions Oscar's guide-built mri ran with. Other Linux-only dependencies and C libraries
# are the solver's choice.
