# ============================================================
# Stimulation Protocol
# ============================================================
# Target:      Hippocampus (anterior, left; Weizhen 0.05 mask)
# Mode:        Online TUS — DRAFT (trial-locked delivery)
# Experiment:  Trial-locked delivery; triggered by task events.
#              Each trial receives a 1 s pulse; the ITI (DurationOff) allows the
#              tissue to cool between trials. Thermal load is lower than or equal
#              to the conservative offline estimate in
#              stimulation_test_offline_Draft.yaml.
# Source:      Collaborator (Zane) email 2026-07-22
# Published anchor for online (trial-locked) human TUS:
#              Fomenko et al. (2020) eLife 9:e54497, doi:10.7554/eLife.54497
#              M1, 500 kHz, TMS-TUS, n=16. Their "basic parameters": PRF 1000 Hz,
#              DC 30 %, sonication 0.5 s, ISI 5 s, 10-20 sonications per block,
#              in-situ ISPPA 2.32 W/cm2 (ISPTA 0.69 at DC 30 %), MI 0.19.
#              Behavioural block: 0.5 s per trial, TUS onset 250 ms before the
#              target, 180 trials, 45 s cumulative sonication.
#              What they found, and what it means for this draft:
#                - online suppression of MEPs needs >= 0.4 s of sonication;
#                  0.1-0.3 s did nothing.  Our 1 s per trial is on the safe
#                  side of that.
#                - DC 10 % suppressed more than 30 % or 50 %.  Lower DC is not
#                  weaker here; our DC 0.3 follows the offline family, not
#                  their best online value.
#                - PRF (200 / 500 / 1000 Hz) made no difference.  Our PRF 5 Hz
#                  is far outside their range and untested for online use.
#                - effects appeared in blocked delivery, not interleaved.
#              The second AllDC_PRF_Duration entry below reproduces their
#              behavioural regime so the two thermal loads can be compared in
#              one step-05 run.
# Used by:     scripts/TUS/notebook/step05_babelbrain.ipynb
#
# Device is not described here.  Focal range, carrier frequency and the
# calibration table belong to the transducer YAML named by the site config
# (config/sites/*.yaml -> config/transducers/*.yaml).  Measured per-subject
# focal depths belong to the study's status document, not to a protocol file.
#
# Protocol values below are restated for reading; BabelBrain uses the
# AllDC_PRF_Duration block at the bottom of this file.
#   Burst length:          60 ms   (= 1000 / PRF × DC = 1000/5 × 0.3)
#   PRF:                    5 Hz
#   DC:                   0.3      (30%)
#   Duration per cycle:     1 s    (per-trial pulse length)
#   DurationOff per cycle:  2 s    (inter-trial interval)
#   Repetitions:          200      (number of trials)
#
# ============================================================
# Glossary
# ============================================================
# BaseIsppa    Planned in-situ ISPPA (W/cm²) at the focal point; the reference
#              intensity for the BHTE thermal solve. Set to your intended
#              experimental in-situ intensity. BabelBrain scales results linearly
#              from this value — no re-simulation needed for other power levels.
#              The TPO takes free-field (in-water) ISPPA as its input, not the
#              in-situ value, so the two differ by the skull/scalp loss.
#              write_tpo_summary_BB() back-calculates the per-subject setting
#              into *_Summary.csv (one row per DC/PRF/Duration combination):
#                required_freefield_isppa_w_cm2 = BaseIsppa / derating_ratio
#                required_freefield_ispta_w_cm2 = the above x DC
#                derating_ratio, derating_dB    = (max |p| in brain /
#                                                  max |p| in water) ** 2
#              When the transducer YAML carries calibration.isppa_w_per_cm2
#              (CTX-500 has it, the UMD DPX-500 does not) the CSV also gives
#              calibrated_ref_isppa_w_cm2, factor_vs_calibrated_ref,
#              exceeds_calibrated_ref, and insitu_isppa_at_ref_w_cm2 (the
#              in-situ ISPPA reachable at the calibrated reference).
#              Exceeding the reference is reported, not blocked -- the TPO
#              power limit is adjustable, though the vendor calls operating
#              above the calibrated range off-label.
#
# AllDC_PRF_Duration  List of protocol variants; each entry runs one BHTE solve.
#
#   DC          Duty cycle (0–1): fraction of each pulse period during which
#               ultrasound is active.  ISPTA = ISPPA × DC.
#               E.g. DC=0.3, PRF=5 Hz → 60 ms on per 200 ms period.
#
#   PRF         Pulse repetition frequency (Hz): number of pulses per second
#               within the sonication burst.  Controls burst structure, not the
#               carrier (transducer) frequency.
#
#   Duration    Sonication-on duration per cycle (s): how long the device fires
#               in one on/off repetition.
#
#   DurationOff Rest duration per cycle (s): cool-down between repetitions.
#               PLACEHOLDER: replace with the actual task ITI once the design is finalised.
#
#   Repetitions Number of complete on/off cycles.
#               Total time = Repetitions × (Duration + DurationOff).
#               E.g. Repetitions=200, Duration=1 s, DurationOff=2 s → 600 s (10 min).
#
#   NumberGroupedSonications
#               Number of grouped bursts within each Duration block.
#               1 = single continuous burst per cycle (no sub-grouping).
#               Required key for BabelBrain CalculateThermalProcess.
#
#   PauseBetweenGroupedSonications
#               Pause between grouped bursts within one Duration block (s).
#               0.0 when NumberGroupedSonications=1 (no-op).
#               Required key for BabelBrain CalculateThermalProcess.

BaseIsppa: 5.0  # W/cm² — planned in-situ ISPPA at focal point; BHTE scaling reference

AllDC_PRF_Duration:
  - DC: 0.3
    PRF: 5.0
    Duration: 1.0          # per-trial pulse length
    DurationOff: 2.0       # inter-trial interval (ITI)
    Repetitions: 200       # number of trials
    NumberGroupedSonications: 1         # no sub-grouping (all 200 trials treated as 1 group)
    PauseBetweenGroupedSonications: 0.0 # no-op (only 1 group)
  # Fomenko et al. (2020) behavioural regime, for thermal comparison only.
  # Their in-situ ISPPA was 2.32 W/cm2; BaseIsppa above (5.0) is kept so the
  # two rows share a reference, scale the result by 2.32/5.0 to read theirs.
  - DC: 0.3
    PRF: 1000.0
    Duration: 0.5          # per-trial sonication
    DurationOff: 4.5       # ISI 5 s minus the 0.5 s on
    Repetitions: 180       # 180 trials, 45 s cumulative sonication
    NumberGroupedSonications: 1
    PauseBetweenGroupedSonications: 0.0
