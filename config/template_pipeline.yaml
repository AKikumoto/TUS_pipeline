# Pipeline YAML template: one experiment's TUS preparation
# Read by: python src/run_prepall.py --config <your copy> [--dry-run]
#
# Copy this file into your project (e.g. analysis/configs/pipeline_TUS.yaml),
# not into this package: the copy names your subjects, and this package is
# public. Fill in every TBD field.
#
# Paths are absolute (~ allowed) or relative to the copy's own folder.
# sub_list_dir alone is relative to the site YAML's data_root.
# Other options (registration_type, intensity_norm, z_threshold, top_pct,
# fix_qform, vtx, ...) are listed in the src/run_prepall.py docstring.

site: "TBD"                       # e.g. ~/TUS_pipeline/config/sites/site_UMD_AK.yaml
sub_list_dir: "TBD"               # subject folder under data_root, e.g. SUB_LIST_PREP;
                                  # leave out to use the site YAML's

# One entry per target. seg runs once per subject, the other steps once per target.
targets:
  - mask:       "TBD"             # e.g. ~/TUS_pipeline/masks/standardized/aMCC_NeuroSynth112_mask_MNI.nii.gz
    mask_label: "TBD"             # e.g. aMCC_NeuroSynth112
    # additional_offset: 20.0     # optional: this target's pad, mm; replaces the subject's

target_side: _L                   # _L | _R | '' ; set per subject below where it differs
additional_offset: 0.0            # gel pad, mm

steps: [seg, reg, plantus]        # any of seg, reg, com, plantus, sweep, babel
stim: "TBD"                       # sweep and babel, e.g. ~/TUS_pipeline/config/stimulation/<protocol>.yaml

subjects:
  - sub_id: sub-01
  - sub_id: sub-02
    target_side: _R               # overrides the default above
  - sub_id: sub-03
    skip: true
